<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独 - Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ==================== 开始屏幕 ==================== -->
        <section id="start-screen" class="screen active">
            <div class="start-content">
                <h1 class="app-title">数 独</h1>
                <p class="app-subtitle">Sudoku</p>

                <div class="difficulty-section">
                    <p class="section-label">选择难度</p>
                    <div class="difficulty-buttons">
                        <button class="diff-btn" data-difficulty="easy">
                            <span class="diff-icon">&#9679;</span>
                            <span class="diff-label">简单</span>
                            <span class="diff-desc">Easy</span>
                        </button>
                        <button class="diff-btn" data-difficulty="medium">
                            <span class="diff-icon">&#9679;&#9679;</span>
                            <span class="diff-label">中级</span>
                            <span class="diff-desc">Medium</span>
                        </button>
                        <button class="diff-btn" data-difficulty="hard">
                            <span class="diff-icon">&#9679;&#9679;&#9679;</span>
                            <span class="diff-label">高级</span>
                            <span class="diff-desc">Hard</span>
                        </button>
                    </div>
                </div>

                <button id="resume-btn" class="resume-btn hidden">
                    继续游戏
                    <span id="resume-info" class="resume-info"></span>
                </button>

                <div id="storage-warning" class="storage-warning hidden">
                    &#9888; 本地存储不可用，游戏进度将不会保存
                </div>

                <div class="records-section">
                    <h2 class="records-title">最佳记录</h2>
                    <div id="records-content" class="records-content">
                        <p class="records-empty">暂无记录</p>
                    </div>
                </div>

                <div class="print-section">
                    <button id="print-btn" class="print-btn">&#128424; 打印练习</button>
                    <a href="solve.html" class="print-btn solve-link">&#128269; 解题器</a>
                </div>

                
            </div>
        </section>

        <!-- ==================== 打印难度选择 ==================== -->
        <div id="print-diff-dialog" class="overlay hidden">
            <div class="overlay-content">
                <h2>打印数独</h2>
                <p>选择难度</p>
                <div class="print-diff-options">
                    <button class="print-diff-btn" data-diff="easy">
                        <span class="print-diff-label">简单</span>
                        <span class="print-diff-desc">Easy</span>
                    </button>
                    <button class="print-diff-btn" data-diff="medium">
                        <span class="print-diff-label">中级</span>
                        <span class="print-diff-desc">Medium</span>
                    </button>
                    <button class="print-diff-btn" data-diff="hard">
                        <span class="print-diff-label">高级</span>
                        <span class="print-diff-desc">Hard</span>
                    </button>
                </div>
                <button id="print-diff-cancel" class="overlay-btn">取消</button>
            </div>
        </div>

        <!-- ==================== 打印容器 ==================== -->
        <div id="print-container" class="print-container hidden">
            <div id="print-content" class="print-content"></div>
        </div>

        <!-- ==================== 游戏屏幕 ==================== -->
        <section id="game-screen" class="screen hidden">
            <!-- 顶部栏 -->
            <header class="game-header">
                <button id="back-btn" class="header-btn" aria-label="返回菜单">&#8592; 菜单</button>
                <span id="diff-label" class="diff-label-header">简单</span>
                <span id="timer-display" class="timer-display">00:00</span>
            </header>

            <!-- 棋盘 -->
            <div class="board-wrapper">
                <div id="board" class="board" role="grid" aria-label="数独棋盘">
                    <!-- JS 动态生成 81 个单元格 -->
                </div>
            </div>

            <!-- 状态栏 -->
            <div class="status-bar">
                <span id="mistakes-display" class="mistakes-display">失误: 0/5</span>
                <div class="status-actions">
                    <button id="undo-btn" class="action-btn" disabled title="撤销">
                        <span class="btn-icon">&#8630;</span>
                    </button>
                    <button id="hint-btn" class="action-btn" title="提示">
                        <span class="btn-icon">&#9888;</span>
                    </button>
                    <button id="auto-check-btn" class="action-btn" title="自动检查">
                        <span class="btn-icon">&#10003;</span>
                    </button>
                    <button id="pencil-btn" class="action-btn" title="笔记模式">
                        <span class="btn-icon">&#9998;</span>
                    </button>
                </div>
            </div>

            <!-- 数字键盘 -->
            <div class="numpad" role="group" aria-label="数字键盘">
                <button class="num-btn" data-value="1">1</button>
                <button class="num-btn" data-value="2">2</button>
                <button class="num-btn" data-value="3">3</button>
                <button class="num-btn" data-value="4">4</button>
                <button class="num-btn" data-value="5">5</button>
                <button class="num-btn" data-value="6">6</button>
                <button class="num-btn" data-value="7">7</button>
                <button class="num-btn" data-value="8">8</button>
                <button class="num-btn" data-value="9">9</button>
                <button class="num-btn erase-btn" data-value="0" aria-label="擦除">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 20H7a2 2 0 0 1-1.5-.7l-3.5-4a2 2 0 0 1 0-2.6l10-10a2 2 0 0 1 2.8 0l5.6 5.6a2 2 0 0 1 0 2.8L16 17"/>
                        <path d="M6.5 13.5L11 18"/>
                    </svg>
                </button>
            </div>

            <!-- 底部操作 -->
            <footer class="game-footer">
                <button id="pause-btn" class="footer-btn">暂停</button>
                <button id="save-btn" class="footer-btn">保存并退出</button>
                <button id="restart-btn" class="footer-btn">重新开始</button>
            </footer>

            <!-- 暂停遮罩 -->
            <div id="pause-overlay" class="overlay hidden">
                <div class="overlay-content">
                    <h2>游戏已暂停</h2>
                    <button id="resume-game-btn" class="overlay-btn primary-btn">继续游戏</button>
                    <button id="quit-btn" class="overlay-btn">退出到菜单</button>
                </div>
            </div>

            <!-- 生成中遮罩 -->
            <div id="generating-overlay" class="overlay hidden">
                <div class="overlay-content">
                    <div class="spinner"></div>
                    <p>正在生成谜题...</p>
                </div>
            </div>

            <!-- 错误遮罩 -->
            <div id="error-overlay" class="overlay hidden">
                <div class="overlay-content">
                    <h2>&#9888; 出错了</h2>
                    <p id="error-message">无法生成有效的谜题</p>
                    <button id="error-retry-btn" class="overlay-btn primary-btn">重试</button>
                    <button id="error-back-btn" class="overlay-btn">返回菜单</button>
                </div>
            </div>
        </section>

        <!-- ==================== 胜利屏幕 ==================== -->
        <section id="win-screen" class="screen hidden">
            <div class="win-content">
                <div class="win-icon">&#127881;</div>
                <h1 class="win-title">恭喜通关！</h1>
                <p class="win-subtitle">你成功完成了数独谜题</p>

                <div class="win-stats">
                    <div class="stat-item">
                        <span class="stat-label">难度</span>
                        <span id="win-difficulty" class="stat-value">简单</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">用时</span>
                        <span id="win-time" class="stat-value">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">失误</span>
                        <span id="win-mistakes" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">提示</span>
                        <span id="win-hints" class="stat-value">0</span>
                    </div>
                </div>

                <div id="new-record-badge" class="new-record hidden">
                    &#9733; 新纪录！
                </div>

                <div class="win-actions">
                    <button id="play-again-btn" class="overlay-btn primary-btn">再来一局</button>
                    <button id="win-menu-btn" class="overlay-btn">返回菜单</button>
                </div>
            </div>
        </section>
    </div>

    <script defer src="script.js"></script>
</body>
</html>
