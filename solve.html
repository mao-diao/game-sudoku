<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独解题器 - Sudoku Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="solve-page">
    <div id="app">
        <!-- ===== 解题屏幕 ===== -->
        <section id="solve-screen" class="screen active">
            <!-- 状态栏 -->
            <header class="solve-header">
                <a href="index.html" class="solve-back-btn">&#8592; 返回</a>
                <span id="solve-status" class="solve-status">等待输入</span>
            </header>

            <!-- 棋盘 -->
            <div class="board-wrapper">
                <div id="solve-board" class="board" role="grid" aria-label="数独棋盘">
                    <!-- JS 生成 81 格 -->
                </div>
            </div>

            <!-- 提示信息 -->
            <div id="solve-message" class="solve-message"></div>

            <!-- 数字键盘 -->
            <div class="numpad" role="group" aria-label="数字键盘">
                <button class="num-btn" data-value="1">1</button>
                <button class="num-btn" data-value="2">2</button>
                <button class="num-btn" data-value="3">3</button>
                <button class="num-btn" data-value="4">4</button>
                <button class="num-btn" data-value="5">5</button>
                <button class="num-btn" data-value="6">6</button>
                <button class="num-btn" data-value="7">7</button>
                <button class="num-btn" data-value="8">8</button>
                <button class="num-btn" data-value="9">9</button>
                <button class="num-btn erase-btn" data-value="0" aria-label="擦除">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 20H7a2 2 0 0 1-1.5-.7l-3.5-4a2 2 0 0 1 0-2.6l10-10a2 2 0 0 1 2.8 0l5.6 5.6a2 2 0 0 1 0 2.8L16 17"/>
                        <path d="M6.5 13.5L11 18"/>
                    </svg>
                </button>
            </div>

            <!-- 控制按钮 -->
            <div class="solve-controls">
                <button id="solve-btn" class="solve-action-btn primary">解题</button>
                <button id="clear-btn" class="solve-action-btn">清空</button>
            </div>

            <!-- 底部 -->
            
        </section>
    </div>

    <script defer src="script.js"></script>
</body>
</html>
